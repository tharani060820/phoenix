      border-radius: 4px;

      background: var(--th-primary);
    }

    .glass-panel {

      border: 1px solid var(--th-border) !important;
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.07);

      background: var(--th-glass-card) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--th-border) !important;
      box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.55);
    }

    /* Tactical HUD Framing Brackets */
    .hud-bracket {
      position: relative;
    }
    .hud-bracket::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 8px;
      height: 8px;
      border-top: 2px solid var(--th-hud-color) !important;
      border-left: 2px solid var(--th-hud-color) !important;
      pointer-events: none;
    }
    .hud-bracket::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 8px;
      height: 8px;
      border-bottom: 2px solid var(--th-hud-color) !important;
      border-right: 2px solid var(--th-hud-color) !important;
      pointer-events: none;

      background: var(--th-primary-badge);

      isMuted: false,
      playClick: function() {
        if (this.isMuted) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(350, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.06, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } catch(e) {}
      },
      playAccessGranted: function() {
        if (this.isMuted) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.06, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.2);
          });
        } catch(e) {}
      },
      playSiren: function() {
        if (this.isMuted) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          
          const t = ctx.currentTime;
          osc.frequency.setValueAtTime(650, t);
          osc.frequency.linearRampToValueAtTime(1150, t + 0.25);
          osc.frequency.linearRampToValueAtTime(650, t + 0.5);
          osc.frequency.linearRampToValueAtTime(1150, t + 0.75);
          osc.frequency.linearRampToValueAtTime(650, t + 1.0);
          
          osc.start(t);
          osc.stop(t + 1.15);
        } catch(e) {
          console.warn("Audio Context playback:", e);
        }
      },
      playChirp: function() {
        if (this.isMuted) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          
          const t = ctx.currentTime;
          osc.frequency.setValueAtTime(1800, t);
          osc.frequency.exponentialRampToValueAtTime(2600, t + 0.12);
          
          osc.start(t);

        } catch(e) {}

    function EmployeeFaultView({ session }) {
      const [category, setCategory] = useState('Engine Overheat / Coolant Rupture');
      const [severity, setSeverity] = useState('CRITICAL');
      const [odometer, setOdometer] = useState('142850');
      const [location, setLocation] = useState('Route R05, Mile 18 Mountain Cut');
      const [description, setDescription] = useState('Temperature gauge spiked to 118C on incline. White steam visible under hood. Vehicle safely stopped on shoulder.');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submittedTicket, setSubmittedTicket] = useState(null);

      const handleSubmitFault = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        try {
          const res = await fetch('/api/faults/report', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.token}`
            },
            body: JSON.stringify({
              vehicle_id: 'V23',
              category,
              severity,
              odometer_km: parseInt(odometer) || 142850,
              location,
              description,
              timestamp: new Date().toLocaleTimeString('en-US', { hour12: false })
            })
          });

          if (res.ok) {
            const data = await res.json();
            setSubmittedTicket(data.ticket_id || 'FLT-9821');
          } else {
            // Local fallback simulation
            setSubmittedTicket('FLT-' + Math.random().toString(36).substring(2, 6).toUpperCase());
          }
        } catch (err) {
          setSubmittedTicket('FLT-' + Math.random().toString(36).substring(2, 6).toUpperCase());
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-6 rounded-xl border border-brand-border/60">
            <span className="text-[10px] font-mono uppercase bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold">

                <IconCheck className="w-6 h-6 text-emerald-400 flex-shrink-0" />

                  <div className="font-extrabold text-sm text-white">

                    Incident queued for Central Command. Response tow truck and relief fleet notified.

              <button

                  </label>
                  <input
                    type="text"
                    value="V23 (Heavy Hauler 18T)"

                    className="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-400 text-xs font-mono"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">
                    Fault Classification
                  </label>
                  <select
                    value={category}

    // ==============================================================
    // ==============================================================
    // 3. ADVANCED DEPENDENCY GRAPH & RIPPLE VISUALIZER (ENTERPRISE EDITION)
    // ==============================================================
    function DependencyGraphView({ networkData, disruptionsData, selectedNode, onSelectNode, onSwitchTab }) {
      const svgRef = useRef(null);
      const zoomBehaviorRef = useRef(null);

      // Layout mode: 'hierarchical' | 'force' | 'radial'
      const [layoutMode, setLayoutMode] = useState('hierarchical');
      
      // Cascade Time-Machine Step:
      // 0: Normal | 1: R05 Blocked | 2: V23 Broken | 3: D1045 At Risk | 4: C208 SLA Alert | 5: AI Reroute Proposed | 6: Rewire Committed
      const [cascadeStep, setCascadeStep] = useState(3);
      const [isPlayingCascade, setIsPlayingCascade] = useState(false);
      const [cascadeTimer, setCascadeTimer] = useState(null);

      // Filtering & Subgraph options
      const [filterType, setFilterType] = useState('ALL');
      const [filterHealth, setFilterHealth] = useState('ALL');
      const [searchNodeQuery, setSearchNodeQuery] = useState('');
      const [isolateCascadeCluster, setIsolateCascadeCluster] = useState(false);
      const [showEdgeLabels, setShowEdgeLabels] = useState(false);
      const [showParticles, setShowParticles] = useState(true);
      const [showMetricsHud, setShowMetricsHud] = useState(true);

      // Local Dynamic Rewire state
      const [isRewired, setIsRewired] = useState(false);
      const [hoveredNode, setHoveredNode] = useState(null);

      const baseGraph = networkData.graph || { nodes: [], edges: [] };

      // Cascade Scrubber Step Definitions
      const cascadeStages = [
        { step: 0, label: "T+00s: Normal Baseline", desc: "All 5 echelons operating at 98.2% on-time pace. All nodes green.", status: "HEALTHY" },
        { step: 1, label: "T+10s: Corridor R05 Blocked", desc: "Multi-vehicle collision Mile 18. Route R05 capacity drops to 0%.", status: "DISRUPTED" },
        { step: 2, label: "T+25s: Hauler V23 Breakdown", desc: "Engine overheat (118°C) halts Rig V23 in mountain cut. Dead-zone.", status: "DISRUPTED" },
        { step: 3, label: "T+40s: Cryo Cargo D1045 Frozen", desc: "Sub-zero vaccine payload at risk. SLA deadline 15:30 threatened.", status: "CRITICAL" },
        { step: 4, label: "T+55s: Client C208 SLA Threat", desc: "AcroTech BioLabs approaching contract breach. $2,450 penalty risk.", status: "RIPPLE" },
        { step: 5, label: "T+60s: AI Reroute Candidate Ready", desc: "Standby Sprinter V27 via Connector R07 identified. 95% Feasibility.", status: "AI_READY" },
        { step: 6, label: "RECOVERED: Graph Rewired", desc: "D1045 reassigned to V27. Downstream nodes transition to Healthy.", status: "RECOVERED" }
      ];

      // Dynamic Node & Edge states based on cascade step and rewire state
      const dynamicNodes = useMemo(() => {
        return baseGraph.nodes.map(n => {
          let h = n.health;
          let risk = n.risk_score;

          if (cascadeStep === 0) {
            h = 'HEALTHY';
            risk = 5;
          } else if (cascadeStep === 1) {
            if (n.id === 'R05') { h = 'DISRUPTED'; risk = 98; }
            else { h = 'HEALTHY'; risk = 10; }
          } else if (cascadeStep === 2) {
            if (n.id === 'R05' || n.id === 'V23') { h = 'DISRUPTED'; risk = 95; }
            else { h = 'HEALTHY'; risk = 10; }
          } else if (cascadeStep === 3) {
            if (['R05', 'V23', 'D1045', 'D1021', 'D1022', 'D1023'].includes(n.id)) {
              h = 'DISRUPTED';
              risk = n.id === 'D1045' ? 87 : 80;
            } else if (['D1024', 'D1025', 'D1026'].includes(n.id)) {
              h = 'SECONDARY_RIPPLE';
              risk = 65;
            } else {
              h = 'HEALTHY';
              risk = 12;
            }
          } else if (cascadeStep === 4) {
            if (['R05', 'V23', 'D1045', 'D1021', 'D1022', 'D1023'].includes(n.id)) {
              h = 'DISRUPTED'; risk = 90;
            } else if (['C208', 'C001', 'C002', 'C003', 'D1024', 'D1025', 'D1026', 'D1039'].includes(n.id)) {
              h = 'SECONDARY_RIPPLE'; risk = 78;
            } else {
              h = 'HEALTHY'; risk = 12;
            }
          } else if (cascadeStep >= 5) {
            if (isRewired || cascadeStep === 6) {
              if (['D1045', 'C208', 'V27', 'R07'].includes(n.id)) {
                h = 'HEALTHY';
                risk = 12;
              } else if (['R05', 'V23'].includes(n.id)) {
                h = 'DISRUPTED';
                risk = 92;
              } else {
                h = n.health;
                risk = n.risk_score;
              }
            } else {
              if (['V27', 'R07'].includes(n.id)) {
                h = 'AI_PREDICTION';
                risk = 20;
              }
            }
          }

          return { ...n, health: h, risk_score: risk };
        });
      }, [baseGraph.nodes, cascadeStep, isRewired]);

      // Dynamic edges
      const dynamicEdges = useMemo(() => {
        let edges = [...baseGraph.edges];
        if (isRewired || cascadeStep === 6) {
          // Replace V23 -> D1045 with active V27 -> D1045
          edges = edges.filter(e => !(e.source === 'V23' && e.target === 'D1045'));
          edges = edges.map(e => {
            if (e.id === 'e-rec-V27-D1045') {
              return { ...e, dashed: false, activeRewired: true, label: 'Active Reroute (Sprinter V27)' };
            }
            return e;
          });
        }
        return edges;
      }, [baseGraph.edges, isRewired, cascadeStep]);

      // Filtered nodes
      const filteredNodes = useMemo(() => {
        const clusterIds = new Set(['WH02', 'R05', 'R07', 'V23', 'V27', 'V19', 'D1045', 'D1021', 'D1022', 'D1023', 'D1024', 'D1025', 'C208', 'C001', 'C002', 'C003']);

        return dynamicNodes.filter(n => {
          if (isolateCascadeCluster && !clusterIds.has(n.id)) return false;
          const matchType = filterType === 'ALL' || n.type.toUpperCase() === filterType;
          const matchHealth = filterHealth === 'ALL' ||
            (filterHealth === 'DISRUPTED' && n.health === 'DISRUPTED') ||
            (filterHealth === 'RIPPLE' && n.health === 'SECONDARY_RIPPLE') ||
            (filterHealth === 'HEALTHY' && n.health === 'HEALTHY') ||
            (filterHealth === 'AI' && n.health === 'AI_PREDICTION');
          const matchQuery = !searchNodeQuery || n.id.toLowerCase().includes(searchNodeQuery.toLowerCase()) || n.label.toLowerCase().includes(searchNodeQuery.toLowerCase());
          return matchType && matchHealth && matchQuery;
        });
      }, [dynamicNodes, filterType, filterHealth, searchNodeQuery, isolateCascadeCluster]);

      const filteredNodeIds = useMemo(() => new Set(filteredNodes.map(n => n.id)), [filteredNodes]);

      const filteredEdges = useMemo(() => {
        return dynamicEdges.filter(e => {
          const sId = typeof e.source === 'object' ? e.source.id : e.source;
          const tId = typeof e.target === 'object' ? e.target.id : e.target;
          return filteredNodeIds.has(sId) && filteredNodeIds.has(tId);
        });
      }, [dynamicEdges, filteredNodeIds]);

      // Breadcrumb path computation from hovered/selected node
      const activePath = useMemo(() => {
        const focusId = hoveredNode?.id || selectedNode?.id || 'D1045';
        const nodeMap = new Map(dynamicNodes.map(n => [n.id, n]));
        const edges = dynamicEdges;

        const parents = [];
        let curr = focusId;
        while (curr) {
          parents.unshift(curr);
          const inEdge = edges.find(e => (typeof e.target === 'object' ? e.target.id : e.target) === curr);
          curr = inEdge ? (typeof inEdge.source === 'object' ? inEdge.source.id : inEdge.source) : null;
        }

        const children = [];
        curr = focusId;
        while (curr) {
          const outEdge = edges.find(e => (typeof e.source === 'object' ? e.source.id : e.source) === curr && !e.dashed);
          curr = outEdge ? (typeof outEdge.target === 'object' ? outEdge.target.id : outEdge.target) : null;
          if (curr) children.push(curr);
        }

        const fullPath = [...new Set([...parents, ...children])];
        return {
          ids: new Set(fullPath),
          pathNodes: fullPath.map(id => nodeMap.get(id)).filter(Boolean)
        };
      }, [hoveredNode, selectedNode, dynamicNodes, dynamicEdges]);

      // Auto-play cascade timer
      useEffect(() => {
        let t = null;
        if (isPlayingCascade) {
          t = setInterval(() => {
            setCascadeStep(prev => {
              if (prev < 6) return prev + 1;
              setIsPlayingCascade(false);
              return prev;
            });
          }, 3500);
        }
        return () => clearInterval(t);
      }, [isPlayingCascade]);

      // Dynamic Graph Rewire Commit
      const handleCommitRewire = () => {
        setIsRewired(true);
        setCascadeStep(6);
        if (window.confetti) {
          window.confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
        }
      };

      // D3 Rendering Hook
      useEffect(() => {
        if (!svgRef.current) return;

        const svg = d3.select(svgRef.current);
        svg.selectAll('*').remove();

        const width = svgRef.current.clientWidth || 980;
        const height = svgRef.current.clientHeight || 620;

        // Container Group
        const g = svg.append('g').attr('class', 'main-canvas-g');

        // Zoom & Pan
        const zoom = d3.zoom()
          .scaleExtent([0.2, 3.5])
          .on('zoom', (event) => {
            g.attr('transform', event.transform);
          });

        zoomBehaviorRef.current = zoom;
        svg.call(zoom);

        // Cloned data
        const nodes = filteredNodes.map(d => ({ ...d }));
        const nodeMap = new Map(nodes.map(n => [n.id, n]));
        
        const links = filteredEdges.map(d => {
          const s = typeof d.source === 'object' ? d.source.id : d.source;
          const t = typeof d.target === 'object' ? d.target.id : d.target;
          return {
            ...d,
            source: nodeMap.get(s) || s,
            target: nodeMap.get(t) || t
          };
        }).filter(l => l.source && l.target);

        // SVG Markers & Filters
        const defs = svg.append('defs');

        // Glow Filter
        const glow = defs.append('filter')
          .attr('id', 'adv-glow')
          .attr('x', '-50%').attr('y', '-50%')
          .attr('width', '200%').attr('height', '200%');
        glow.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'coloredBlur');
        const feMerge = glow.append('feMerge');
        feMerge.append('feMergeNode').attr('in', 'coloredBlur');
        feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

        // Arrow markers
        const markerColors = {
          healthy: '#10B981',
          disrupted: '#EF4444',
          ripple: '#F59E0B',
          ai: '#8B5CF6',
          default: '#38BDF8'
        };

        Object.entries(markerColors).forEach(([key, color]) => {
          defs.append('marker')
            .attr('id', `marker-${key}`)
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 24)
            .attr('refY', 0)
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-5L10,0L0,5')
            .attr('fill', color);
        });

        // ==========================================
        // LAYOUT COMPUTATIONS
        // ==========================================
        let simulation = null;

        if (layoutMode === 'hierarchical') {
          // Tier groups
          const echelonOrder = ['Warehouse', 'Route', 'Vehicle', 'Delivery', 'Customer'];
          const tierGroups = { Warehouse: [], Route: [], Vehicle: [], Delivery: [], Customer: [] };

          nodes.forEach(n => {
            if (tierGroups[n.type]) tierGroups[n.type].push(n);
          });

          // Draw Tier Column Banners in Background
          const columnX = [100, 310, 530, 750, 970];
          const colG = g.append('g').attr('class', 'tier-column-headers');

          echelonOrder.forEach((tierName, idx) => {
            const x = columnX[idx];
            // Header box
            const hBox = colG.append('g').attr('transform', `translate(${x}, 35)`);
            hBox.append('rect')
              .attr('x', -80)
              .attr('y', 0)
              .attr('width', 160)
              .attr('height', 28)
              .attr('rx', 6)
              .attr('fill', '#0B132B')
              .attr('stroke', '#1E305C')
              .attr('stroke-width', 1);

            hBox.append('text')
              .attr('x', 0)
              .attr('y', 18)
              .attr('text-anchor', 'middle')
              .attr('fill', '#38BDF8')
              .attr('font-size', '11px')
              .attr('font-family', 'JetBrains Mono')
              .attr('font-weight', 'bold')
              .text(`${idx + 1}. ${tierName.toUpperCase()}S (${tierGroups[tierName].length})`);

            // Column vertical guide line
            colG.append('line')
              .attr('x1', x)
              .attr('y1', 70)
              .attr('x2', x)
              .attr('y2', height - 30)
              .attr('stroke', '#1E305C')
              .attr('stroke-width', 1)
              .attr('stroke-dasharray', '3,6')
              .attr('opacity', 0.5);
          });

          // Assign coordinates to nodes
          echelonOrder.forEach((tierName, tierIdx) => {
            const group = tierGroups[tierName];
            const x = columnX[tierIdx];
            const nCount = group.length;
            const startY = 100;
            const availableH = height - 160;
            const gapY = nCount > 1 ? Math.min(65, availableH / (nCount - 1)) : 0;
            const offsetY = (availableH - (gapY * (nCount - 1))) / 2;

            group.forEach((node, i) => {
              node.x = x;
              node.y = startY + offsetY + (i * gapY);
            });
          });

        } else if (layoutMode === 'radial') {
          // Radial layout around epicenter (R05 or selectedNode)
          const centerNodeId = selectedNode?.id || 'R05';
          const centerNode = nodeMap.get(centerNodeId) || nodes[0];
          const cx = width / 2;
          const cy = height / 2;

          // Compute hops from center
          const distMap = new Map();
          distMap.set(centerNode.id, 0);
          const queue = [centerNode.id];

          while (queue.length > 0) {
            const u = queue.shift();
            const d = distMap.get(u);
            links.forEach(l => {
              const s = l.source.id;
              const t = l.target.id;
              if (s === u && !distMap.has(t)) {
                distMap.set(t, d + 1);
                queue.push(t);
              } else if (t === u && !distMap.has(s)) {
                distMap.set(s, d + 1);
                queue.push(s);
              }
            });
          }

          // Rings
          const rings = [[], [], [], []];
          nodes.forEach(n => {
            const hop = distMap.get(n.id) ?? 3;
            const ringIdx = Math.min(hop, 3);
            rings[ringIdx].push(n);
          });

          // Draw radar circles
          const radG = g.append('g').attr('class', 'radial-rings');
          const ringRadii = [0, 130, 260, 390];

          ringRadii.forEach((r, idx) => {
            if (r > 0) {
              radG.append('circle')
                .attr('cx', cx)
                .attr('cy', cy)
                .attr('r', r)
                .attr('fill', 'none')
                .attr('stroke', '#1E305C')
                .attr('stroke-width', 1.2)
                .attr('stroke-dasharray', '4,6');

              radG.append('text')
                .attr('x', cx + r + 6)
                .attr('y', cy - 4)
                .attr('fill', '#64748B')
                .attr('font-size', '10px')
                .attr('font-family', 'JetBrains Mono')
                .text(`Hop ${idx} Perimeter`);
            }
          });

          // Position nodes on rings
          rings.forEach((ringNodes, ringIdx) => {
            const r = ringRadii[ringIdx];
            if (ringIdx === 0) {
              ringNodes.forEach(n => { n.x = cx; n.y = cy; });
            } else {
              const stepAngle = (2 * Math.PI) / ringNodes.length;
              ringNodes.forEach((n, i) => {
                const angle = i * stepAngle - (Math.PI / 2);
                n.x = cx + r * Math.cos(angle);
                n.y = cy + r * Math.sin(angle);
              });
            }
          });

        } else {
          // Force Directed Simulation
          simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.dashed ? 160 : 90))
            .force('charge', d3.forceCharge().strength(-320))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(38));
        }

        // ==========================================
        // RENDER EDGES (CUBIC BEZIER & LINES)
        // ==========================================
        const linkGroup = g.append('g').attr('class', 'links-layer');

        const linkPathGen = (d) => {
          if (layoutMode === 'hierarchical') {
            // Smooth horizontal S-curve
            return `M ${d.source.x} ${d.source.y} C ${(d.source.x + d.target.x) / 2} ${d.source.y}, ${(d.source.x + d.target.x) / 2} ${d.target.y}, ${d.target.x} ${d.target.y}`;
          }
          return `M ${d.source.x} ${d.source.y} L ${d.target.x} ${d.target.y}`;
        };

        const linkElements = linkGroup.selectAll('.link-path')
          .data(links)
          .enter().append('path')
          .attr('id', (d, i) => `edge-path-${i}`)
          .attr('class', d => `link-path ${d.dashed ? 'edge-animated' : ''}`)
          .attr('d', linkPathGen)
          .attr('fill', 'none')
          .attr('stroke', d => {
            if (d.dashed) return '#A855F7';
            if (d.activeRewired) return '#10B981';
            const sHealth = d.source.health;
            const tHealth = d.target.health;
            if (sHealth === 'DISRUPTED' && tHealth === 'DISRUPTED') return '#EF4444';
            if (sHealth === 'DISRUPTED' || tHealth === 'SECONDARY_RIPPLE') return '#F59E0B';
            return '#1E305C';
          })
          .attr('stroke-width', d => {
            if (d.dashed || d.activeRewired) return 2.8;
            if (d.source.health === 'DISRUPTED') return 2.4;
            return 1.6;
          })
          .attr('stroke-dasharray', d => d.dashed ? '6,6' : 'none')
          .attr('opacity', d => {
            if (activePath.ids.size > 0) {
              const inPath = activePath.ids.has(d.source.id) && activePath.ids.has(d.target.id);
              return inPath ? 1 : 0.15;
            }
            return 0.85;
          })
          .attr('marker-end', d => {
            if (d.dashed) return 'url(#marker-ai)';
            if (d.activeRewired) return 'url(#marker-healthy)';
            if (d.source.health === 'DISRUPTED') return 'url(#marker-disrupted)';
            if (d.target.health === 'SECONDARY_RIPPLE') return 'url(#marker-ripple)';
            return 'url(#marker-default)';
          });

        // Edge Labels (Optional Toggle)
        if (showEdgeLabels) {
          const edgeLabels = linkGroup.selectAll('.edge-label')
            .data(links)
            .enter().append('text')
            .attr('class', 'edge-label font-mono text-[9px]')
            .attr('fill', '#64748B')
            .attr('dy', -4)
            .append('textPath')
            .attr('xlink:href', (d, i) => `#edge-path-${i}`)
            .attr('startOffset', '50%')
            .attr('text-anchor', 'middle')
            .text(d => d.label || d.type);
        }

        // ==========================================
        // ANIMATED FLOW PARTICLES ALONG LINKS
        // ==========================================
        if (showParticles) {
          const particlesGroup = g.append('g').attr('class', 'particles-layer');
          
          links.forEach((d, i) => {
            // Only animate along active or AI links
            const pCircle = particlesGroup.append('circle')
              .attr('r', d.dashed ? 3.5 : 2.5)
              .attr('fill', d.dashed ? '#A855F7' : (d.source.health === 'DISRUPTED' ? '#EF4444' : '#06B6D4'))
              .attr('opacity', 0.9);

            const anim = pCircle.append('animateMotion')
              .attr('dur', d.dashed ? '2s' : (d.source.health === 'DISRUPTED' ? '1.5s' : '3.5s'))
              .attr('repeatCount', 'indefinite')
              .attr('path', linkPathGen(d));
          });
        }

        // ==========================================
        // RENDER NODES (RICH GLYPHS & PULSING AURA)
        // ==========================================
        const nodeGroup = g.append('g').attr('class', 'nodes-layer');

        const node = nodeGroup.selectAll('.node-item')
          .data(nodes)
          .enter().append('g')
          .attr('class', 'node-item cursor-pointer')
          .attr('transform', d => `translate(${d.x},${d.y})`)
          .attr('opacity', d => {
            if (activePath.ids.size > 0) {
              return activePath.ids.has(d.id) ? 1 : 0.18;
            }
            return 1;
          })
          .on('mouseenter', (event, d) => setHoveredNode(d))
          .on('mouseleave', () => setHoveredNode(null))
          .on('click', (event, d) => {
            event.stopPropagation();
            onSelectNode(d);
          });

        if (simulation) {
          node.call(d3.drag()
            .on('start', (event, d) => {
              if (!event.active) simulation.alphaTarget(0.3).restart();
              d.fx = d.x; d.fy = d.y;
            })
            .on('drag', (event, d) => {
              d.fx = event.x; d.fy = event.y;
            })
            .on('end', (event, d) => {
              if (!event.active) simulation.alphaTarget(0);
              d.fx = null; d.fy = null;
            }));
        }

        // 1. Radar Pulse Shockwaves for Disrupted / Ripple Nodes
        node.filter(d => d.health === 'DISRUPTED')
          .append('circle')
          .attr('r', 26)
          .attr('fill', 'none')
          .attr('stroke', '#EF4444')
          .attr('stroke-width', 2)
          .attr('class', 'radar-pulse');

        node.filter(d => d.health === 'SECONDARY_RIPPLE')
          .append('circle')
          .attr('r', 22)
          .attr('fill', 'none')
          .attr('stroke', '#F59E0B')
          .attr('stroke-width', 1.5)
          .attr('stroke-dasharray', '3,3')
          .attr('class', 'radar-pulse');

        node.filter(d => d.health === 'AI_PREDICTION')
          .append('circle')
          .attr('r', 24)
          .attr('fill', 'none')
          .attr('stroke', '#A855F7')
          .attr('stroke-width', 2)
          .attr('stroke-dasharray', '4,4')
          .attr('class', 'radar-pulse');

        // 2. Custom Node Geometries based on Echelon
        node.each(function(d) {
          const el = d3.select(this);
          const color = d.health === 'DISRUPTED' ? '#EF4444' :
                        d.health === 'SECONDARY_RIPPLE' ? '#F59E0B' :
                        d.health === 'AI_PREDICTION' ? '#A855F7' : '#10B981';

          if (d.type === 'Warehouse') {
            // Hexagon for Warehouse
            el.append('polygon')
              .attr('points', '-18,-10 0,-20 18,-10 18,10 0,20 -18,10')
              .attr('fill', '#0B132B')
              .attr('stroke', color)
              .attr('stroke-width', 2.5)
              .attr('filter', d.health === 'DISRUPTED' ? 'url(#adv-glow)' : 'none');
          } else if (d.type === 'Route') {
            // Capsule for Route
            el.append('rect')
              .attr('x', -22).attr('y', -14)
              .attr('width', 44).attr('height', 28)
              .attr('rx', 8)
              .attr('fill', '#0F172A')
              .attr('stroke', color)
              .attr('stroke-width', 2.5);
            // Road dashed centerline
            el.append('line')
              .attr('x1', -16).attr('y1', 0).attr('x2', 16).attr('y2', 0)
              .attr('stroke', '#FACC15').attr('stroke-width', 1.2).attr('stroke-dasharray', '2,2');
          } else if (d.type === 'Vehicle') {
            // Vehicle badge
            el.append('circle')
              .attr('r', 16)
              .attr('fill', '#0B132B')
              .attr('stroke', color)
              .attr('stroke-width', 2.5)
              .attr('filter', d.health === 'DISRUPTED' ? 'url(#adv-glow)' : 'none');
          } else if (d.type === 'Delivery') {
            // Delivery rounded box
            el.append('rect')
              .attr('x', -15).attr('y', -15)
              .attr('width', 30).attr('height', 30)
              .attr('rx', 5)
              .attr('fill', '#0F172A')
              .attr('stroke', color)
              .attr('stroke-width', 2.5);
          } else {
            // Customer diamond
            el.append('polygon')
              .attr('points', '0,-17 17,0 0,17 -17,0')
              .attr('fill', '#0B132B')
              .attr('stroke', color)
              .attr('stroke-width', 2.5);
          }
        });

        // 3. Inner Glyph / Initial
        node.append('text')
          .attr('text-anchor', 'middle')
          .attr('dy', '.35em')
          .attr('fill', '#FFFFFF')
          .attr('font-size', '10px')
          .attr('font-family', 'JetBrains Mono')
          .attr('font-weight', 'bold')
          .text(d => {
            if (d.type === 'Warehouse') return 'WH';
            if (d.type === 'Route') return d.id;
            if (d.type === 'Vehicle') return d.id;
            if (d.type === 'Delivery') return 'D';
            return 'C';
          });

        // 4. Node Label Underneath
        node.append('text')
          .attr('x', 0)
          .attr('y', 28)
          .attr('text-anchor', 'middle')
          .attr('fill', '#E2E8F0')
          .attr('font-size', '10px')
          .attr('font-family', 'JetBrains Mono')
          .attr('font-weight', '600')
          .text(d => d.type === 'Route' ? d.label.split('-')[1]?.trim() || d.id : d.id);

        // Simulation Tick for Force Layout
        if (simulation) {
          simulation.on('tick', () => {
            linkElements.attr('d', linkPathGen);
            node.attr('transform', d => `translate(${d.x},${d.y})`);
          });
        }

      }, [filteredNodes, filteredEdges, layoutMode, activePath, showEdgeLabels, showParticles, isRewired]);

      // Quick Camera Reset / Center Functions
      const handleResetZoom = () => {
        if (svgRef.current && zoomBehaviorRef.current) {
          d3.select(svgRef.current).transition().duration(600).call(
            zoomBehaviorRef.current.transform,
            d3.zoomIdentity
          );
        }
      };

      const handleCenterDisruption = () => {
        const target = dynamicNodes.find(n => n.id === 'R05') || dynamicNodes.find(n => n.id === 'V23');
        if (target && svgRef.current && zoomBehaviorRef.current) {
          const width = svgRef.current.clientWidth || 980;
          const height = svgRef.current.clientHeight || 620;
          const transform = d3.zoomIdentity
            .translate(width / 2, height / 2)
            .scale(1.4)
            .translate(-(target.x || width / 2), -(target.y || height / 2));

          d3.select(svgRef.current).transition().duration(800).call(zoomBehaviorRef.current.transform, transform);
          onSelectNode(target);
        }
      };

      const handleCenterAI = () => {
        const target = dynamicNodes.find(n => n.id === 'V27');
        if (target && svgRef.current && zoomBehaviorRef.current) {
          const width = svgRef.current.clientWidth || 980;
          const height = svgRef.current.clientHeight || 620;
          const transform = d3.zoomIdentity
            .translate(width / 2, height / 2)
            .scale(1.4)
            .translate(-(target.x || width / 2), -(target.y || height / 2));

          d3.select(svgRef.current).transition().duration(800).call(zoomBehaviorRef.current.transform, transform);
          onSelectNode(target);
        }
      };

      return (
        <div className="space-y-4 h-[calc(100vh-140px)] flex flex-col">
          
          {/* Header & Advanced Toolbars */}
          <div className="glass-panel p-4 rounded-xl border border-brand-border/60 flex flex-wrap items-center justify-between gap-4 flex-shrink-0">
            <div>
              <div className="flex items-center gap-2">
                <h2 className="text-base font-extrabold text-white flex items-center gap-2">
                  <span>DEPENDENCY GRAPH & RIPPLE CASCADE ENGINE</span>
                  <span className="text-[10px] font-mono bg-purple-950 text-purple-300 border border-purple-700 px-2 py-0.5 rounded font-bold">
                    ENTERPRISE v2.4
                  </span>
                </h2>
              </div>
              <p className="text-xs text-slate-400 font-mono">
                Multi-Echelon Topological Propagation • Kinetic Ripple Analysis • Dynamic Edge Rewiring
              </p>
            </div>

            {/* Layout Mode Switcher */}
            <div className="flex items-center bg-slate-900 p-1 rounded-lg border border-brand-border text-xs font-mono">
              <button
                onClick={() => setLayoutMode('hierarchical')}
                className={`px-3 py-1.5 rounded-md flex items-center gap-1.5 transition-all ${
                  layoutMode === 'hierarchical' ? 'bg-cyan-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <IconLayers className="w-3.5 h-3.5" />
                <span>Multi-Echelon Columns</span>
              </button>
              <button
                onClick={() => setLayoutMode('radial')}
                className={`px-3 py-1.5 rounded-md flex items-center gap-1.5 transition-all ${
                  layoutMode === 'radial' ? 'bg-cyan-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <IconCompass className="w-3.5 h-3.5" />
                <span>Radial Cascade</span>
              </button>
              <button
                onClick={() => setLayoutMode('force')}
                className={`px-3 py-1.5 rounded-md flex items-center gap-1.5 transition-all ${
                  layoutMode === 'force' ? 'bg-cyan-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'
                }`}
              >
                <IconNetwork className="w-3.5 h-3.5" />
                <span>Force Physics</span>
              </button>
            </div>
          </div>

          {/* CASCADE TIME-MACHINE PLAYER HUD */}
          <div className="glass-panel px-5 py-3 rounded-xl border border-cyan-500/40 bg-gradient-to-r from-slate-900/90 via-brand-panel to-slate-900/90 flex flex-wrap items-center justify-between gap-4 z-10 shadow-lg">
            
            {/* Player Controls */}
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1">
                <button
                  onClick={() => {
                    setCascadeStep(0);
                    setIsPlayingCascade(false);
                    setIsRewired(false);
                  }}
                  className="p-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300"
                  title="Reset Cascade"
                >
                  ⏮️
                </button>
                <button
                  onClick={() => setIsPlayingCascade(!isPlayingCascade)}
                  className={`px-3 py-1 rounded text-xs font-mono font-bold flex items-center gap-1.5 transition-all ${
                    isPlayingCascade ? 'bg-amber-600 text-white animate-pulse' : 'bg-cyan-600 hover:bg-cyan-500 text-white'
                  }`}
                >
                  <span>{isPlayingCascade ? '⏸️ PAUSE' : '▶️ PLAY CASCADE'}</span>
                </button>
              </div>

              {/* Step indicator pills */}
              <div className="flex items-center gap-1 overflow-x-auto py-1">
                {cascadeStages.map((stg, i) => (
                  <button
                    key={i}
                    onClick={() => {
                      setCascadeStep(i);
                      setIsPlayingCascade(false);
                    }}
                    className={`px-2 py-0.5 rounded text-[10px] font-mono font-bold whitespace-nowrap transition-all border ${
                      cascadeStep === i
                        ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400 shadow-sm'
                        : 'bg-slate-900/60 text-slate-400 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    Step {i}
                  </button>
                ))}
              </div>
            </div>

            {/* Current Step Description Banner */}
            <div className="flex-1 max-w-md hidden md:block text-left">
              <div className="text-xs font-bold text-white flex items-center gap-2">
                <span>{cascadeStages[cascadeStep].label}</span>
                <span className={`text-[9px] font-mono px-1.5 py-0.2 rounded font-bold ${
                  cascadeStages[cascadeStep].status === 'CRITICAL' || cascadeStages[cascadeStep].status === 'DISRUPTED' ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                  cascadeStages[cascadeStep].status === 'RIPPLE' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                  cascadeStages[cascadeStep].status === 'AI_READY' ? 'bg-purple-950 text-purple-300 border border-purple-800 animate-pulse' :
                  'bg-emerald-950 text-emerald-400 border border-emerald-800'
                }`}>
                  {cascadeStages[cascadeStep].status}
                </span>
              </div>
              <div className="text-[11px] text-slate-300 truncate">
                {cascadeStages[cascadeStep].desc}
              </div>
            </div>

            {/* Dynamic AI Rewire CTA Button */}
            <div className="flex items-center gap-2">
              {cascadeStep >= 5 && !isRewired ? (
                <button
                  onClick={handleCommitRewire}
                  className="px-4 py-1.5 rounded-lg bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 font-extrabold text-xs text-white shadow-lg shadow-purple-600/30 animate-pulse flex items-center gap-1.5 border border-purple-400"
                >
                  <IconZap className="w-3.5 h-3.5 text-white" />
                  <span>⚡ COMMIT DYNAMIC REWIRE</span>
                </button>
              ) : isRewired ? (
                <span className="px-3 py-1 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-600 text-xs font-mono font-bold flex items-center gap-1">
                  <IconCheck className="w-3.5 h-3.5" /> GRAPH REWIRED & HEALED
                </span>
              ) : null}
            </div>
          </div>

          {/* Interactive Graph Canvas Wrapper */}
          <div className="flex-1 glass-panel rounded-xl border border-brand-border/60 relative overflow-hidden flex flex-col">
            
            {/* Top Toolbar Controls & Filters */}
            <div className="absolute top-4 left-4 z-10 flex flex-wrap items-center gap-2 text-xs">
              {/* Type Filter */}
              <select
                value={filterType}
                onChange={(e) => setFilterType(e.target.value)}
                className="bg-slate-900/90 backdrop-blur border border-brand-border rounded px-2.5 py-1 text-slate-200 font-mono text-xs focus:outline-none focus:border-cyan-500"
              >
                <option value="ALL">All Types</option>
                <option value="WAREHOUSE">Warehouses</option>
                <option value="ROUTE">Routes</option>
                <option value="VEHICLE">Vehicles</option>
                <option value="DELIVERY">Deliveries</option>
                <option value="CUSTOMER">Customers</option>
              </select>

              {/* State Filter */}
              <select
                value={filterHealth}
                onChange={(e) => setFilterHealth(e.target.value)}
                className="bg-slate-900/90 backdrop-blur border border-brand-border rounded px-2.5 py-1 text-slate-200 font-mono text-xs focus:outline-none focus:border-cyan-500"
              >
                <option value="ALL">All States</option>
                <option value="DISRUPTED">🔴 Disrupted</option>
                <option value="RIPPLE">🟠 Ripple</option>
                <option value="HEALTHY">🟢 Healthy</option>
                <option value="AI">🟣 AI Candidate</option>
              </select>

              {/* Isolate Subgraph Button */}
              <button
                onClick={() => setIsolateCascadeCluster(!isolateCascadeCluster)}
                className={`px-2.5 py-1 rounded text-xs font-mono font-bold border transition-all ${
                  isolateCascadeCluster ? 'bg-amber-950 text-amber-300 border-amber-600 shadow' : 'bg-slate-900/90 text-slate-400 border-brand-border'
                }`}
              >
                {isolateCascadeCluster ? '⚡ Cluster Isolated' : 'Isolate Cluster'}
              </button>

              {/* Toggle Flow Particles */}
              <button
                onClick={() => setShowParticles(!showParticles)}
                className={`px-2.5 py-1 rounded text-xs font-mono border transition-all ${
                  showParticles ? 'bg-cyan-950 text-cyan-300 border-cyan-700' : 'bg-slate-900/90 text-slate-500 border-slate-800'
                }`}
              >

              <div className="space-y-4 text-xs">
                <div className="p-4 rounded-xl bg-purple-950/30 border border-purple-500/40 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-mono uppercase text-purple-300 font-bold">TOP RANKED RECOVERY</span>
                    <span className="text-[10px] font-mono bg-purple-900 text-purple-300 px-2 py-0.5 rounded font-bold">
                      94/100 SCORE
                    </span>
                  </div>
                  <h4 className="text-sm font-bold text-white">Redirect to Sprinter V27 via Corridor R07</h4>
                  <p className="text-slate-300 text-xs">
                    Standby high-speed sprinter V27 is idling 3.2km away. Route R07 bypasses Highway 45 entirely with zero traffic.
                  </p>
                  <div className="text-[11px] text-emerald-400 font-mono font-semibold pt-1">
                    ✓ Secures Customer SLA with 12m buffer
                  </div>
                </div>

                <button
                  onClick={onOpenRecovery}
                  className="w-full py-2.5 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-xs shadow-lg shadow-purple-600/20 flex items-center justify-center gap-2"
                >
                  <IconBrain className="w-4 h-4" />
                  <span>Open Full AI Recovery Engine</span>
                </button>
              </div>
            )}

          </div>

          {/* Drawer Footer Actions */}
          <div className="pt-4 border-t border-brand-border/60 space-y-2">
            <button
              onClick={onClose}
              className="w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300"
            >
              Close Inspector [ESC]
            </button>
          </div>
        </div>
      );
    }


    // 9. SEARCH & QUICK INSPECT MODAL
    // ==============================================================
    function SearchModal({ networkData, onClose, onSelectEntity }) {
      const [query, setQuery] = useState('');

      const deliveries = networkData.deliveries || [];
      const vehicles = networkData.vehicles || [];
      const routes = networkData.routes || [];

      const filteredItems = useMemo(() => {
        if (!query.trim()) return deliveries.slice(0, 8);
        const q = query.toLowerCase();
        
        const dMatches = deliveries.filter(d => d.id.toLowerCase().includes(q) || d.title.toLowerCase().includes(q));
        const vMatches = vehicles.filter(v => v.id.toLowerCase().includes(q) || v.driver.toLowerCase().includes(q));
        const rMatches = routes.filter(r => r.id.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
        
        return [...dMatches, ...vMatches, ...rMatches].slice(0, 10);
      }, [query, deliveries, vehicles, routes]);

      return (
        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-start justify-center pt-20 p-4" onClick={onClose}>
          <div className="w-full max-w-xl glass-panel rounded-2xl border border-brand-border p-4 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
            {/* Search Input */}
            <div className="relative">
              <IconSearch className="w-5 h-5 text-cyan-400 absolute left-3 top-3" />
              <input
                type="text"
                autoFocus
                placeholder="Search delivery (D1045), vehicle (V23), route (R05)..."
                value={query}
                onChange={e => setQuery(e.target.value)}
                className="w-full bg-slate-900 border border-brand-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 font-mono"
              />
            </div>

            {/* Results List */}
            <div className="max-h-72 overflow-y-auto space-y-1.5 text-xs">
              {filteredItems.map((item, idx) => (
                <div
                  key={idx}
                  onClick={() => onSelectEntity(item)}
                  className="p-3 rounded-lg bg-slate-900/50 hover:bg-slate-800/80 border border-brand-border/60 hover:border-cyan-500/50 cursor-pointer flex items-center justify-between transition-all"
                >
                  <div className="flex items-center gap-3">
                    <span className="font-mono font-bold text-cyan-400">{item.id}</span>
                    <div>
                      <div className="font-bold text-white">{item.title || item.name || item.driver}</div>
                      <div className="text-[11px] text-slate-400 font-mono">
                        {item.status || item.health || 'ACTIVE'}
                      </div>
                    </div>
                  </div>
                  <span className="text-[10px] font-mono text-slate-400 uppercase">Inspect in Graph →</span>
                </div>
              ))}
            </div>

            <div className="text-right text-[10px] font-mono text-slate-500 pt-2 border-t border-brand-border/40">
              Press [ESC] to close
            </div>
          </div>
        </div>
      );
    }

    // ==============================================================
    // 10. NOTIFICATION CENTER DRAWER
    // ==============================================================
    function NotificationDrawer({ notifications, onClose, onMarkAllRead }) {
      return (
        <div className="fixed inset-y-0 right-0 w-80 glass-panel border-l border-brand-border shadow-2xl z-40 p-5 flex flex-col justify-between">
          <div>
            <div className="flex items-center justify-between border-b border-brand-border/60 pb-3 mb-4">
              <div className="flex items-center gap-2">
                <IconBell className="w-5 h-5 text-cyan-400" />
                <h3 className="font-bold text-sm text-white">Notifications ({notifications.length})</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold">✕</button>
            </div>

            <div className="space-y-2.5 max-h-[calc(100vh-160px)] overflow-y-auto">
              {notifications.map(n => (
                <div
                  key={n.id}
                  className={`p-3 rounded-lg border text-xs space-y-1 ${
                    n.type === 'critical' ? 'bg-rose-950/20 border-rose-800/60' :
                    n.type === 'warning' ? 'bg-amber-950/20 border-amber-800/60' :
                    n.type === 'ai' ? 'bg-purple-950/20 border-purple-800/60' : 'bg-slate-900/60 border-brand-border'
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-white">{n.title}</span>
                    <span className="text-[10px] font-mono text-slate-400">{n.time}</span>
                  </div>
                  <p className="text-[11px] text-slate-300">{n.desc}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="pt-3 border-t border-brand-border/60">
            <button
              onClick={onMarkAllRead}
              className="w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300"
            >
              Mark All as Read
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // ROOT APP WITH MANDATORY AUTHENTICATION GUARD
    // ==========================================
    function App() {
      const [session, setSession] = useState(() => {
        return window.LRNAuth ? window.LRNAuth.getSession() : null;
      });

      const handleLoginSuccess = (newSession) => {
        setSession(newSession);
      };

      const handleLogout = async () => {
        if (window.LRNAuth) {
          await window.LRNAuth.logout();
        }
        setSession(null);
      };

      // Strict Authentication Gate:
      // The public must NOT be able to directly access the LRN operational system.
      // The required flow is: Website -> Login -> Verify Employee/Manager -> Check Role -> Grant Access -> LRN System.
      // If unauthenticated: The login page is the ONLY accessible screen.
      if (!session) {
        return <LoginPage onLoginSuccess={handleLoginSuccess} />;
      }

      // Granted access to protected system with authenticated session
      return (
        <ProtectedCommandCenter
          session={session}
          onLogout={handleLogout}
        />
      );
    }

    // Mount Root App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
