version: '3.8'

services:
  lrn-app:
    build: .
    container_name: lrn_recovery_system
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=lrn_resilience_jwt_secret_hackathon_2026_super_secure_key
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=lrn_graph_password_2026
      - DATABASE_URL=postgresql://lrn_admin:lrn_pg_secret_2026@postgres:5432/lrn_adaptive_learning
    depends_on:
      - neo4j
      - postgres
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: lrn_neo4j_graph
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/lrn_graph_password_2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./database/neo4j_schema.cypher:/var/lib/neo4j/import/schema.cypher
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lrn_postgres_adaptive
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lrn_admin
      - POSTGRES_PASSWORD=lrn_pg_secret_2026
      - POSTGRES_DB=lrn_adaptive_learning
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  pg_data:
